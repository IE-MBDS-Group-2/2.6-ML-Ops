# environment.yml  [Dependencies]
# -------------------------------------------------------------------
# Purpose   List the packages (and Python version) the project needs
# Used by   You and your teammates: conda env create -f environment.yml
# Why       Everyone runs the same code on the same versions ("works on my machine" ends here)
#
# Typical groups
#   data and modelling    e.g. pandas, scikit-learn, joblib
#   notebooks and plots   exploration only
#   quality (stage 2)     test runner, coverage, style checker
#   stage 3               config, tracking, serving and locking tools
#
# Stage 3: conda-lock.yml freezes these into exact versions for CI and Docker
# environment.yml  [Shared conda environment for the team pipeline]
name: mlops-group2
channels:
  - conda-forge
dependencies:
  - python=3.12
  # pipeline packages (every import in src/)
  - pandas
  - numpy
  - scikit-learn
  - joblib
  - pyyaml
  # dev tools (check code, not needed to run it)
  - pytest
  - pytest-cov
  - flake8
  - pylint
  - radon
  - black
  - isort
  - pip
  - pip:
      - detect-secrets
      - yfinance        # scripts/fetch_prices.py only (the pipeline never downloads)
