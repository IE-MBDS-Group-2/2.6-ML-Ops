name: ci
on:
  merge_group:
  # deploy.yml (#76) reruns this same CI on the release commit before deploying.
  workflow_call:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  # The job name is the required check on dev and main (rulesets): never rename it.
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # Fail fast: lint takes seconds, the environment takes minutes. Same flake8 version as the lock file.
      - name: flake8 (before the environment)
        run: |
          version="$(grep -A1 '^- name: flake8$' conda-lock.yml | sed -n 's/^  version: //p')"
          pipx run "flake8==${version}" --isolated --max-line-length=120 --extend-ignore=E203 src tests scripts

      # The exact package versions the Docker image ships, not a fresh solve of environment.yml.
      - name: environment from conda-lock.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda-lock.yml
          environment-name: mlops-group2
          init-shell: bash
          cache-environment: true

      # A changed environment.yml without a regenerated lock re-solves here and changes the file: red.
      - name: conda-lock.yml matches environment.yml
        run: |
          conda-lock lock --check-input-hash -f environment.yml -p linux-64
          git diff --exit-code conda-lock.yml

      # A fresh checkout has no data/ (never committed): synthetic prices from config.yaml, logged as SYNTHETIC.
      # Run as a module: `python scripts/make_sample_prices.py` cannot import src (see #99).
      - name: sample prices
        run: python -m scripts.make_sample_prices

      # The whole pipeline end to end on the sample data, offline: no W&B, no secrets.
      - name: python -m src.main on the sample data
        env:
          WANDB_MODE: disabled
          MODEL_SOURCE: local
        run: python -m src.main

      - name: pytest with branch coverage
        run: pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90

      - name: radon (no function above complexity 10)
        run: |
          report="$(radon cc src scripts -s -n C)"
          echo "${report:-radon: nothing above complexity 10}"
          test -z "$report"

      - name: docker build
        run: docker build -t etf-advisor .
