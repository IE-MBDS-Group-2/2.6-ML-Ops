name: ci
on:
  merge_group:
  # deploy.yml (#76) reruns this same CI on the release commit before deploying.
  workflow_call:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  # The job name is the required check on dev and main (rulesets): never rename it.
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # Fail fast: lint takes seconds, the environment takes minutes. Same flake8 version as the lock file.
      - name: flake8 (before the environment)
        run: |
          version="$(grep -A1 '^- name: flake8$' conda-lock.yml | sed -n 's/^  version: //p')"
          pipx run "flake8==${version}" --isolated --max-line-length=120 --extend-ignore=E203 src tests scripts

      # Imports sorted (isort's defaults, the same version as the lock file).
      - name: isort (before the environment)
        run: |
          version="$(grep -A1 '^- name: isort$' conda-lock.yml | sed -n 's/^  version: //p')"
          pipx run "isort==${version}" --check-only src tests scripts

      # No new secret in any tracked file. .secrets.baseline lists the known harmless findings (test fixtures);
      # conda-lock.yml and the baseline itself are excluded (their checksums and hashes look like secrets). Compared by file and secret hash,
      # so moving a known line does not fail the check; any new finding does.
      - name: detect-secrets (before the environment)
        run: |
          version="$(grep -A1 '^- name: detect-secrets$' conda-lock.yml | sed -n 's/^  version: //p')"
          pipx run "detect-secrets==${version}" scan --exclude-files '(conda-lock\.yml|\.secrets\.baseline)$' > "$RUNNER_TEMP/secrets.json"
          python3 - "$RUNNER_TEMP/secrets.json" <<'PY'
          import json, sys
          def found(path):
              results = json.load(open(path))["results"]
              return {(name, item["hashed_secret"]) for name, items in results.items() for item in items}
          new = sorted(found(sys.argv[1]) - found(".secrets.baseline"))
          for name, _ in new:
              print(f"::error file={name}::detect-secrets: possible secret in {name}. Remove it, or if it is a "
                    "harmless fixture, regenerate .secrets.baseline and say so in the PR.")
          sys.exit(1 if new else 0)
          PY

      # The exact package versions the Docker image ships, not a fresh solve of environment.yml.
      - name: environment from conda-lock.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: conda-lock.yml
          environment-name: mlops-group2
          init-shell: bash
          cache-environment: true

      # A changed environment.yml without a regenerated lock re-solves here and changes the file: red.
      - name: conda-lock.yml matches environment.yml
        run: |
          conda-lock lock --check-input-hash -f environment.yml -p linux-64
          git diff --exit-code conda-lock.yml

      # A fresh checkout has no data/ (never committed): synthetic prices from config.yaml, logged as SYNTHETIC.
      # Run as a module: `python scripts/make_sample_prices.py` cannot import src (see #99).
      - name: sample prices
        run: python -m scripts.make_sample_prices

      # The whole pipeline end to end on the sample data, offline: no W&B, no secrets.
      - name: python -m src.main on the sample data
        env:
          WANDB_MODE: disabled
          MODEL_SOURCE: local
        run: python -m src.main

      - name: pytest with branch coverage
        run: pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90

      # House rule: pylint 10.00, i.e. no message at all (any message makes pylint exit non-zero). Needs the
      # environment, so imports are checked against the real packages. Settings: .pylintrc.
      - name: pylint (no messages)
        run: pylint src scripts

      - name: radon (no function above complexity 10)
        run: |
          report="$(radon cc src scripts -s -n C)"
          echo "${report:-radon: nothing above complexity 10}"
          test -z "$report"

      - name: docker build
        run: docker build -t etf-advisor .
