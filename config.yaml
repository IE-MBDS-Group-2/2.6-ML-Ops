# config.yaml  [Settings: single source of truth]
# Every NON-SECRET setting. Read once by src/main.py and passed into modules as arguments.
# Secrets go in .env. Values marked DECISION come from the 10 Nov call (01_DECISIONS.md).

paths:
  raw_data: "data/raw/prices.csv"
  inference_data: "data/inference/prices_latest.csv"
  processed_data: "data/processed/clean.csv"
  model: "models/model.joblib"
  predictions: "reports/predictions.csv"
  metrics: "reports/metrics.json"
  monitoring: "reports/monitoring.json"
  log_file: "logs/pipeline.log"
  positions: "data/inference/positions.csv"          # optional: one portfolio or sleeve (DECISION D9)
  proposed_portfolio: "reports/proposed_portfolio.csv"
  trades: "reports/trades.csv"
  benchmarks: "reports/benchmarks.csv"
  challengers: "reports/challengers.csv"
  robustness: "reports/robustness.json"
  selection: "reports/selection.csv"
  frequency_comparison: "reports/frequency_comparison.csv"

data:
  tickers: ["SPY", "EFA", "IEF", "GLD", "BIL"]
  start: "2007-05-30"            # BIL starts here; ~60 days only warm up features
  end: "2025-12-31"
  required_columns: ["date", "ticker", "close", "volume"]
  columns:                       # what each price column is called; modules get these names as arguments
    date_column: "date"
    ticker_column: "ticker"
    close_column: "close"
    volume_column: "volume"
  max_abs_daily_return: 0.25     # validate.py stops above this
  inference_days: 300            # fetch_prices.py: trading days kept in the inference file

target_weights:                  # DECISION D19: the mix the portfolio is rebalanced towards
  method: "policy"               # policy = use the weights listed below; or calculate them:
                                 # min_variance | max_sharpe | mean_variance | risk_parity
  policy: {SPY: 0.40, EFA: 0.20, IEF: 0.30, GLD: 0.05, BIL: 0.05}   # your own targets; must sum to 1
  calculated:
    # SHA-256: 3cce101c20eb1bcd5f453176affaa3c7f4a3f470a89973de47617134d6705526
    # Return dates: 2007-09-10 to 2019-12-31; training cut-off: 2019-12-31.
    min_variance:
      SPY: 0.2532459296878587
      EFA: 0.0
      IEF: 0.6
      GLD: 0.14675407031214138
      BIL: 0.0
    max_sharpe:
      SPY: 0.27506277036478993
      EFA: 0.0
      IEF: 0.6000000000000005
      GLD: 0.12493722963520953
      BIL: 0.0
    mean_variance:
      SPY: 0.5027158562205666
      EFA: 3.007684981013869e-17
      IEF: 0.2777285113736169
      GLD: 0.2195556324058164
      BIL: 0.0
    risk_parity:
      SPY: 0.14768266161846705
      EFA: 0.11225045565983753
      IEF: 0.5914027752442063
      GLD: 0.1486641074774892
      BIL: 0.0
rebalancing:                     # DECISION D17/D19: how the user wants to rebalance
  method: "smart"                # smart (our model decides) | calendar | tolerance_band | calendar_and_band
  review: "weekly"               # daily | weekly | monthly: how often the portfolio is looked at
  calendar: "quarterly"          # monthly | quarterly | annually (used by the calendar methods)
  tolerance_band: 5              # percentage points away from target (used by the band methods)

portfolio:
  actions: [0.0, 0.5, 1.0]       # share of the way back to target
  first_decision_date: "2007-09-07"   # first Friday after warm-up; train includes 2008
  current_rule:                  # today's process, the baseline every result is compared with
    drift_band: 0.05             # DECISION D1: absolute percentage points
    quarter_months: [1, 4, 7, 10]   # first Friday of these months
  reward:
    penalty_lambda: 1.0          # DECISION D1: x increase in drawdown during the window
  min_trade: 0.0                 # DECISION D1: none in Stage 2

problem:
  target_column: "best_action"
  problem_type: "classification"
  id_column: "decision_date"

split:                           # DECISION D3: by date; test stays sealed
  train_end: "2019-12-31"
  val_end: "2021-12-31"
  test_end: "2025-12-31"
  # contract split_data() settings, kept for its test only
  test_size: 0.2
  val_size: 0.2
  random_state: 42

features:
  return_weeks: [4, 12]
  vol_days: 20

model:                           # DECISION D5
  type: "classifier"             # DECISION D18: classifier | fitted_q (the reinforcement learning agent)
  params:
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
  random_state: 42

quality_gate:                    # DECISION D2: must match README and TEAM_BRIEF
  metric_key: "max_drawdown_reduction"
  comparison: ">="
  threshold: 0.20
  split: "validation"

fallback:
  min_probability: 0.60          # DECISION D5 (README ESTIMATE)

costs:                           # from PR #9; read by src/costs.py
  aum: 100000000                 # ASSUMPTION: capital in the model portfolio
  model: flat                    # DECISION D1: README baseline; realistic is Stage 3
  flat:
    rate: 0.001
  commission:
    rate: 0.0005
    min_fee: 1.25
    cap: 0.01
  slippage:
    entry_bps: 5.0
    exit_bps: 10.0
    impact_factor: 2.0
    adv_window: 20

logging:
  level: "INFO"

# ---------------------------------------------------------------- Stage 3 (DECISIONS D8 to D20)
positions:                       # column names of the positions file (DECISION D9)
  ticker_column: "ticker"
  value_column: "market_value"

tracking:                        # W&B; secrets and WANDB_MODE live in .env (DECISION D13)
  enabled: true
  project: "etf-rebalancing"
  name: "stage3-classifier"
  group: "stage-3"
  tags: ["stage-3"]
  dataset_artifact: "etf-prices"
  model_artifact: "rebalance-model"
  log_predictions_table: true

api:                             # DECISION D9
  min_history_days: 61           # 12-week return (60 trading days) plus one
  monitoring_batch_size: 20

monitoring:                      # README open gap 12, model card "What triggers a retrain"; scripts/monitor_report.py
  psi_bins: 10                   # deciles of the train years
  psi_limit: 0.2                 # drift alert: the usual PSI reading, above 0.2 is a real shift (0.1 to 0.2: watch)
  tickers: ["SPY", "EFA", "IEF", "GLD"]   # daily returns compared; BIL left out: its return is the T-bill rate,
                                 # near 0 in most train years and ~5% since 2022, so it would alert for good
  window_days: 180               # trading days each Friday looks back: noise alone gives PSI ~ 9/180 = 0.05;
                                 # on synthetic prices, no false alarm and a 1.5x volatility shift caught in ~100 days
  fallback_limit: 0.5            # retrain when the weekly fallback rate is above this...
  fallback_weeks: 4              # ...in each of this many weeks in a row
  date_column: "as_of"           # columns of the serve table the API logs (tracking.PREDICTION_TABLE)
  fallback_column: "fallback"

selection:                       # DECISION D14: train years only; validation and test stay unseen
  enabled: false
  first_train_end: "2012-12-31"
  block: "YE"                    # score one calendar year at a time
  gap_days: 5                    # trading days dropped between train and score, so labels never overlap
  grid:
    C: [0.1, 1.0, 10.0]
    class_weight: ["balanced", null]

rl:                              # DECISION D18: fitted Q iteration, scikit-learn only
  enabled: false
  gamma: 0.95
  n_iterations: 20
  n_episodes: 20
  seeds: [0, 1, 2, 3, 4]         # README: report the median of 5 seeds
  temperature: 1.0               # ESTIMATE: sharpness of the score used by the 60% fallback. Q gaps are first
                                 # divided by their usual size, so this is a plain number: 1.0 means a lead of
                                 # one usual margin scores 0.58 to 0.73; smaller is sharper
  estimator:
    max_depth: 3
    max_iter: 100
    learning_rate: 0.1
    early_stopping: false        # explicit: scikit-learn turns it on by itself above 10,000 rows

benchmarks:                      # DECISION D19: reported, never gated; fitted on the train years only
  enabled: true
  methods: ["min_variance", "max_sharpe", "mean_variance", "risk_parity"]
  risk_aversion: 3.0             # ESTIMATE, mean_variance only
  cash_ticker: "BIL"             # excluded from risky methods; risk-free return for max_sharpe; null = none
  max_weight: 0.60               # maximum fraction in any one risky asset

guards:                          # README "Goal and success metrics"; reported, not gated
  max_return_shortfall: 0.0025   # annual net return no more than 0.25 points below the baseline
  max_cost_ratio: 2.0            # annual trading cost no more than 2 x the baseline's
  max_tracking_error: 0.012      # X = 2 x today's rule on validation 2020-21 (0.0059); agreed with Miguel (#64)

robustness:                      # README robustness checks; reported, never gated
  bootstrap_draws: 1999          # ESTIMATE: block-bootstrap draws for each challenger comparison
  bootstrap_block_weeks: 4       # ESTIMATE: weeks per block, so short-range dependence is kept

challengers:                     # README simple-rule challengers (team ASSUMPTIONS); never tuned on validation
  bands: [0.025, 0.015]
  persistent_drift: {min_assets: 2, band: 0.025, days: 5}
  asymmetric: {drift_threshold: 0.05, drawdown_threshold: -0.10, step: 0.5, min_wait: 4}   # ESTIMATES
  equity_tickers: ["SPY", "EFA"]
