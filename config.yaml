# config.yaml  [Settings: single source of truth]
# Every NON-SECRET setting. Read once by src/main.py and passed into modules as arguments.
# Secrets go in .env. Values marked DECISION come from the 10 Nov call (01_DECISIONS.md).

paths:
  raw_data: "data/raw/prices.csv"
  inference_data: "data/inference/prices_latest.csv"
  processed_data: "data/processed/clean.csv"
  model: "models/model.joblib"
  predictions: "reports/predictions.csv"
  metrics: "reports/metrics.json"
  log_file: "logs/pipeline.log"

data:
  tickers: ["SPY", "EFA", "IEF", "GLD", "BIL"]
  start: "2007-05-30"            # BIL starts here; ~60 days only warm up features
  end: "2025-12-31"
  required_columns: ["date", "ticker", "close", "volume"]
  columns:                       # what each price column is called; modules get these names as arguments
    date: "date"
    ticker: "ticker"
    close: "close"
    volume: "volume"
  max_abs_daily_return: 0.25     # validate.py stops above this
  inference_days: 300            # fetch_prices.py: trading days kept in the inference file

portfolio:
  target_weights: {SPY: 0.40, EFA: 0.20, IEF: 0.30, GLD: 0.05, BIL: 0.05}
  actions: [0.0, 0.5, 1.0]       # share of the way back to target
  first_decision_date: "2007-09-07"   # first Friday after warm-up; train includes 2008
  current_rule:
    drift_band: 0.05             # DECISION D1: absolute percentage points
    quarter_months: [1, 4, 7, 10]   # first Friday of these months
  reward:
    penalty_lambda: 1.0          # DECISION D1: x increase in drawdown during the window
  min_trade: 0.0                 # DECISION D1: none in Stage 2

problem:
  target_column: "best_action"
  problem_type: "classification"
  id_column: "decision_date"

split:                           # DECISION D3: by date; test stays sealed
  train_end: "2019-12-31"
  val_end: "2021-12-31"
  test_end: "2025-12-31"
  # contract split_data() settings, kept for its test only
  test_size: 0.2
  val_size: 0.2
  random_state: 42

features:
  return_weeks: [4, 12]
  vol_days: 20

model:                           # DECISION D5
  params:
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"
  random_state: 42

quality_gate:                    # DECISION D2: must match README and TEAM_BRIEF
  metric_key: "max_drawdown_reduction"
  comparison: ">="
  threshold: 0.20
  split: "validation"

fallback:
  min_probability: 0.60          # DECISION D5 (README ESTIMATE)

costs:                           # from PR #9; read by src/costs.py
  aum: 100000000                 # ASSUMPTION: capital in the model portfolio
  model: flat                    # DECISION D1: README baseline; realistic is Stage 3
  flat:
    rate: 0.001
  commission:
    rate: 0.0005
    min_fee: 1.25
    cap: 0.01
  slippage:
    entry_bps: 5.0
    exit_bps: 10.0
    impact_factor: 2.0
    adv_window: 20

logging:
  level: "INFO"
